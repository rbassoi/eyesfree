<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 820" width="1160" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>EyesFree architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #334155; }
      .layer { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; fill: #64748b; }
      .host { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
      .pkg  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
      .web  { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1.5; }
      .core { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .spec { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .flow { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .out  { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .a { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .ad { stroke: #059669; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1160" height="820" fill="#ffffff"/>
  <text x="40" y="38" font-size="22" font-weight="800" fill="#0f172a">EyesFree — architecture</text>
  <text x="40" y="60" class="s">Layered, dependency-free core; every integration consumes the same VisionProfile → RenderPlan contract.</text>

  <!-- Layer 1: hosts -->
  <text x="40" y="92" class="layer">HOST APPLICATIONS</text>
  <rect class="host" x="40"  y="100" width="200" height="56" rx="12"/>
  <text class="t" x="140" y="124" text-anchor="middle">Plain HTML · CMS</text>
  <text class="s" x="140" y="143" text-anchor="middle">WebView · Capacitor · Electron</text>
  <rect class="host" x="260" y="100" width="200" height="56" rx="12"/>
  <text class="t" x="360" y="124" text-anchor="middle">React</text>
  <text class="s" x="360" y="143" text-anchor="middle">Next.js · Remix · Vite</text>
  <rect class="host" x="480" y="100" width="200" height="56" rx="12"/>
  <text class="t" x="580" y="124" text-anchor="middle">Vue · Angular · Svelte</text>
  <text class="s" x="580" y="143" text-anchor="middle">Solid · Lit · Ionic</text>
  <rect class="host" x="700" y="100" width="200" height="56" rx="12"/>
  <text class="t" x="800" y="124" text-anchor="middle">React Native</text>
  <text class="s" x="800" y="143" text-anchor="middle">Expo · bare RN</text>
  <rect class="host" x="920" y="100" width="200" height="56" rx="12"/>
  <text class="t" x="1020" y="124" text-anchor="middle">Flutter · iOS · Android</text>
  <text class="s" x="1020" y="143" text-anchor="middle">any language / platform</text>

  <!-- Layer 2: integration packages -->
  <text x="40" y="196" class="layer">INTEGRATION PACKAGES</text>
  <rect class="pkg" x="40"  y="204" width="200" height="76" rx="12"/>
  <text class="t" x="140" y="228" text-anchor="middle">@eyesfree/browser</text>
  <text class="s" x="140" y="248" text-anchor="middle">1 file · IIFE + ESM · 15 kB gz</text>
  <text class="s" x="140" y="265" text-anchor="middle">mount() · data-attribute auto-init</text>
  <rect class="pkg" x="260" y="204" width="200" height="76" rx="12"/>
  <text class="t" x="360" y="228" text-anchor="middle">@eyesfree/react</text>
  <text class="s" x="360" y="248" text-anchor="middle">&lt;EyesFreeProvider&gt; · useEyesFree()</text>
  <text class="s" x="360" y="265" text-anchor="middle">&lt;EyesFreeCalibrator&gt;</text>
  <rect class="pkg" x="480" y="204" width="200" height="76" rx="12"/>
  <text class="t" x="580" y="228" text-anchor="middle">@eyesfree/calibrator</text>
  <text class="s" x="580" y="248" text-anchor="middle">&lt;eyesfree-calibrator&gt;</text>
  <text class="s" x="580" y="265" text-anchor="middle">Web Component · i18n · dialog</text>
  <rect class="pkg" x="700" y="204" width="200" height="76" rx="12"/>
  <text class="t" x="800" y="228" text-anchor="middle">@eyesfree/react-native</text>
  <text class="s" x="800" y="248" text-anchor="middle">&lt;EyesFreeText&gt; · &lt;EyesFreeSurface&gt;</text>
  <text class="s" x="800" y="265" text-anchor="middle">native wizard · AsyncStorage</text>
  <rect class="spec" x="920" y="204" width="200" height="76" rx="12"/>
  <text class="t" x="1020" y="228" text-anchor="middle">Open specification</text>
  <text class="s" x="1020" y="248" text-anchor="middle">EF1 profile code · JSON Schema</text>
  <text class="s" x="1020" y="265" text-anchor="middle">RenderPlan · reference ports</text>

  <!-- Layer 3: web engine -->
  <text x="40" y="320" class="layer">WEB RUNTIME</text>
  <rect class="web" x="40" y="328" width="640" height="92" rx="12"/>
  <text class="t" x="60" y="354">@eyesfree/web</text>
  <text class="s" x="60" y="376">EyesFree engine: apply · update · enable/disable · suspend · reset · subscribe · share code/URL</text>
  <text class="s" x="60" y="394">Renderer: SVG &lt;filter&gt; (feComponentTransfer + feConvolveMatrix) + CSS custom properties</text>
  <text class="s" x="60" y="412">Storage adapters · URL hand-off (?eyesfree=EF1…) · BroadcastChannel tab sync · ImageCompensator (Web Worker)</text>

  <!-- Layer 4: core -->
  <text x="40" y="460" class="layer">CORE (PURE TYPESCRIPT · ZERO DEPENDENCIES · NO DOM)</text>
  <rect class="core" x="40" y="468" width="1080" height="84" rx="12"/>
  <text class="t" x="60" y="494">@eyesfree/core</text>
  <text class="s" x="60" y="516">VisionProfile model · validation · normalisation · legacy migration · EF1 codec (encode/decode/parse)</text>
  <text class="s" x="60" y="535">Kernels (isotropic deconvolution, directional anti-ghosting for any angle) · ghost shadows · createRenderPlan() · pixel pipeline</text>

  <!-- arrows host -> packages -->
  <path class="a" d="M220 156 V202"/>
  <path class="a" d="M360 156 V202"/>
  <path class="a" d="M580 156 V202"/>
  <path class="a" d="M800 156 V202"/>
  <path class="a" d="M1020 156 V202"/>
  <!-- packages -> web / core -->
  <path class="a" d="M220 280 V326"/>
  <path class="a" d="M360 280 V326"/>
  <path class="a" d="M440 280 Q 470 300 500 280" />
  <path class="a" d="M580 280 V326"/>
  <path class="a" d="M800 280 V466"/>
  <path class="ad" d="M1020 280 V466"/>
  <text x="1030" y="380" class="s" fill="#059669">ports re-implement</text>
  <text x="1030" y="396" class="s" fill="#059669">the same rules</text>
  <path class="a" d="M600 420 V466"/>

  <!-- Runtime pipeline -->
  <text x="40" y="600" class="layer">RUNTIME DATA FLOW</text>
  <rect class="flow" x="40"  y="610" width="170" height="78" rx="12"/>
  <text class="t" x="125" y="636" text-anchor="middle">Calibration</text>
  <text class="s" x="125" y="656" text-anchor="middle">1 · size · 2 · sharpness</text>
  <text class="s" x="125" y="673" text-anchor="middle">3 · doubled letters</text>
  <rect class="flow" x="250" y="610" width="170" height="78" rx="12"/>
  <text class="t" x="335" y="636" text-anchor="middle">VisionProfile</text>
  <text class="s" x="335" y="656" text-anchor="middle">what the user chose</text>
  <text class="s" x="335" y="673" text-anchor="middle">(no medical data)</text>
  <rect class="flow" x="460" y="610" width="170" height="78" rx="12"/>
  <text class="t" x="545" y="636" text-anchor="middle">RenderPlan</text>
  <text class="s" x="545" y="656" text-anchor="middle">tone · kernels · shadows</text>
  <text class="s" x="545" y="673" text-anchor="middle">spacing · palette</text>
  <path class="a" d="M210 649 H248"/>
  <path class="a" d="M420 649 H458"/>

  <rect class="out" x="680" y="600" width="440" height="40" rx="10"/>
  <text class="s" x="696" y="625"><tspan font-weight="700">DOM</tspan> · SVG filter on root: tone → directional → deconvolution</text>
  <rect class="out" x="680" y="648" width="440" height="40" rx="10"/>
  <text class="s" x="696" y="673"><tspan font-weight="700">Text</tspan> · CSS vars: letter/word spacing + ghost-cancelling shadows</text>
  <rect class="out" x="680" y="696" width="440" height="40" rx="10"/>
  <text class="s" x="696" y="721"><tspan font-weight="700">Raster</tspan> · Web Worker: same kernels on canvas / image pixels</text>
  <rect class="out" x="680" y="744" width="440" height="40" rx="10"/>
  <text class="s" x="696" y="769"><tspan font-weight="700">Native</tspan> · RN / Flutter / iOS / Android styles, shaders, CIConvolution</text>
  <path d="M630 649 H655 M655 620 V764" stroke="#475569" stroke-width="1.6" fill="none"/>
  <path class="a" d="M655 620 H678"/>
  <path class="a" d="M655 668 H678"/>
  <path class="a" d="M655 716 H678"/>
  <path class="a" d="M655 764 H678"/>

  <text x="40" y="806" class="s">Storage (localStorage · AsyncStorage · IndexedDB · your API) persists only the VisionProfile — or its 17-character EF1 code.</text>
</svg>
